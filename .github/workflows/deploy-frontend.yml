# Deploy Frontend
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "apps/shared/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @rafimdan/frontend run typecheck

      - name: Build
        run: pnpm --filter @rafimdan/frontend run build
        env:
          NUXT_PUBLIC_API_BASE: https://api.rafimdan.com
          NUXT_PUBLIC_SITE_URL: https://rafimdan.com

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @rafimdan/frontend exec wrangler pages deploy .output/public --project-name=rafimdan --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
